{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="mb-1">
                Редактирование абонемента
            </h2>

            <p class="text-muted mb-0">
                Ученик: {{ student.name }}
            </p>
        </div>

        <a href="{% url 'student_subscriptions' student.id %}"
           class="btn btn-outline-secondary">
            ← Назад
        </a>

    </div>

    <div class="card shadow-sm border-0">

        <div class="card-body">

            <form method="post">

                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">
                        Начало периода
                    </label>

                    {{ form.start_date }}
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Конец периода
                    </label>

                    {{ form.end_date }}
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Цена одного занятия
                    </label>

                    {{ form.price }}
                </div>

                <div class="form-check mb-4">
                    {{ form.is_paid }}

                    <label class="form-check-label">
                        Абонемент оплачен
                    </label>
                </div>

                <button type="submit"
                        class="btn btn-success">
                    Сохранить
                </button>

                    {% if form.errors %}

                        <div class="alert alert-danger mt-3">

                            {{ form.errors }}

                        </div>

                    {% endif %}
            
            </form>

        </div>

    </div>

</div>

{% endblock %}
